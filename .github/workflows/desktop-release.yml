name: Desktop release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-14
            platform: mac
            target: dmg
            arch: arm64
          - name: macOS Intel
            runner: macos-13
            platform: mac
            target: dmg
            arch: x64
          - name: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
          - name: Windows x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json

      - name: Install pnpm
        run: npm install --global pnpm@11.10.0

      - name: Install desktop dependencies
        run: pnpm install --filter=@waypoint/desktop... --filter=waypoint... --filter=@waypoint/scripts...

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop libraries
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - name: Install Windows Spectre libraries
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe" modify --installPath $installPath --add Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre --quiet --norestart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set release version
        shell: bash
        run: |
          export WAYPOINT_RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          echo "WAYPOINT_RELEASE_VERSION=$WAYPOINT_RELEASE_VERSION" >> "$GITHUB_ENV"
          node scripts/update-release-package-versions.ts "$WAYPOINT_RELEASE_VERSION"
          cp .env.example .env

      - name: Build unsigned desktop artifact
        shell: bash
        run: |
          pnpm run dist:desktop:artifact \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --build-version "$WAYPOINT_RELEASE_VERSION" \
            --verbose

      - uses: actions/upload-artifact@v5
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.AppImage
            release/*.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TARGET: ${{ github.sha }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --target "$TARGET" --generate-notes
          fi
